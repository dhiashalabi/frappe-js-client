name: Bug report
description: Something is broken or behaves unexpectedly
title: '[bug] '
labels: [bug]
type: bug
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting a bug. Search [existing issues](https://github.com/dhiashalabi/frappe-js-client/issues?q=is%3Aissue) first.
              For usage questions, see the [docs](https://dhiashalabi.github.io/frappe-js-client/).
    - type: checkboxes
      id: checks
      attributes:
          label: Checks
          options:
              - label: I searched existing issues and this is not a duplicate
                required: true
              - label: I am using a currently supported version (Node.js 20+)
                required: true
    - type: dropdown
      id: package
      attributes:
          label: Package
          options:
              - frappe-js-client
              - '@frappe-js-client/codegen'
              - Documentation site
              - CI / repository tooling
      validations:
          required: true
    - type: input
      id: package-version
      attributes:
          label: Package version
          placeholder: e.g. 1.0.0
      validations:
          required: true
    - type: dropdown
      id: frappe-version
      attributes:
          label: Frappe Framework version
          options:
              - v14
              - v15
              - v16
              - Not applicable
              - Other
      validations:
          required: true
    - type: dropdown
      id: runtime
      attributes:
          label: Runtime
          options:
              - Node.js
              - Browser
              - Both
              - Not applicable
      validations:
          required: true
    - type: input
      id: node-version
      attributes:
          label: Node.js version
          placeholder: e.g. 22.11.0 (run node -v)
    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: What you expected vs what actually happened.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction
          description: Minimal code or steps. Redact site URLs, API keys, and cookies.
          render: ts
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Error message / logs
          render: shell
