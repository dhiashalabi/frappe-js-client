name: CI

on:
    push:
        branches:
            - develop
            - master
    pull_request:
        branches:
            - develop
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: build
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@22
                  cache: true
                  install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: '0'

            - name: Audit dependencies
              run: pnpm audit --audit-level high

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Check formatting
              run: pnpm format:check

            - name: Lint dependency graph
              run: pnpm lint:deps

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Check public API surface
              run: pnpm api:check

            - name: Check package.json / exports correctness (publint)
              run: pnpm publint

            - name: Check type resolution across module systems (attw)
              run: pnpm attw

            - name: Check changeset
              if: github.event_name == 'pull_request' && !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-changeset')
              run: |
                  git fetch --no-tags origin "${{ github.base_ref }}"
                  if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^packages/'; then
                    pnpm changeset status --since="origin/${{ github.base_ref }}"
                  else
                    echo "No packages/ changes; skipping changeset check."
                  fi

    docs:
        name: docs
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@22
                  cache: true
                  install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: '0'

            - name: Typecheck docs
              run: pnpm docs:typecheck

            - name: Build docs
              run: pnpm docs:build
