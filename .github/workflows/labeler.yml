name: Labeler

on:
    pull_request_target:

jobs:
    labeler:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/labeler@v7.0.0
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  sync-labels: true
